<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drive the Cube</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    /* ← NEW: a simple UI overlay showing controls */
    #instructions {
      position: absolute;    /* float on top of the canvas */
      top: 20px;
      left: 20px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5); /* semi-transparent black */
      padding: 12px 16px;
      border-radius: 8px;
      pointer-events: none;  /* clicks pass through this div to the canvas */
    }
  </style>
</head>
<body>

  <!-- ← NEW: instructions overlay -->
  <div id="instructions">
    W / ↑ — forward<br>
    S / ↓ — backward<br>
    A / ← — turn left<br>
    D / → — turn right
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>

    // ─────────────────────────────────────────
    // SCENE SETUP (same as before)
    // ─────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 4, 8); // ← CHANGED: lift camera up and back
    camera.lookAt(0, 0, 0);       // ← NEW: point camera at the center of the scene

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // The "car" (a cube for now)
    const geometry = new THREE.BoxGeometry(1, 0.5, 2); // wider and longer — car shaped
    const material = new THREE.MeshStandardMaterial({
      color: 0xe94560,
      roughness: 0.3,
      metalness: 0.5
    });
    const car = new THREE.Mesh(geometry, material);
    scene.add(car);

    // Ground plane so we have something to drive on
    const groundGeo = new THREE.PlaneGeometry(50, 50); // flat rectangle, 50×50 units
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 }); // dark green
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2; // rotate flat — PlaneGeometry is vertical by default
    // Math.PI / 2 = 90 degrees. Negative means rotating toward us.
    ground.position.y = -0.25; // sink it just below the car
    scene.add(ground);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
    sunLight.position.set(5, 10, 5);
    scene.add(sunLight);


    // ─────────────────────────────────────────
    // ← NEW: KEYBOARD INPUT SYSTEM
    // ─────────────────────────────────────────

    // This object stores which keys are currently held down
    // true = held, false (or missing) = not held
    const keys = {};

    // When any key is pressed, mark it as true in our keys object
    window.addEventListener('keydown', function(event) {
      keys[event.code] = true;
      // event.code gives us 'KeyW', 'ArrowUp', 'Space', etc.
      // We use event.code (physical key) not event.key (character)
      // because event.key changes with keyboard language settings
    });

    // When any key is released, mark it as false
    window.addEventListener('keyup', function(event) {
      keys[event.code] = false;
    });


    // ─────────────────────────────────────────
    // ← NEW: CAR MOVEMENT VARIABLES
    // ─────────────────────────────────────────

    const speed = 0.08;      // how far the car moves forward each frame
    const turnSpeed = 0.03;  // how many radians the car turns each frame


    // ─────────────────────────────────────────
    // ANIMATION LOOP (updated)
    // ─────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);

      // ← NEW: Read keys and move car

      // TURNING: rotate the car around its Y axis (vertical axis = turning left/right)
      if (keys['ArrowLeft'] || keys['KeyA']) {
        car.rotation.y += turnSpeed; // turn left
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        car.rotation.y -= turnSpeed; // turn right
      }

      // FORWARD / BACKWARD movement
      // This is the trickiest part — we need to move in the direction the car is FACING
      // not always in the same world direction
      //
      // Math.sin and Math.cos turn an angle into X and Z movement components
      // Think of it like this: if the car faces 45°, it moves diagonally
      // sin(angle) = how much to move in X, cos(angle) = how much to move in Z
      if (keys['ArrowUp'] || keys['KeyW']) {
        car.position.x -= Math.sin(car.rotation.y) * speed;
        car.position.z -= Math.cos(car.rotation.y) * speed;
      }
      if (keys['ArrowDown'] || keys['KeyS']) {
        car.position.x += Math.sin(car.rotation.y) * speed;
        car.position.z += Math.cos(car.rotation.y) * speed;
      }

      // ← NEW: Camera follows the car (third-person view)
      // We want the camera to always be behind and above the car
      // So we calculate a point that is offset from the car's position
      // in the direction the car is facing, then move the camera there smoothly

      // Target position for camera: behind the car
      const cameraDistance = 8;  // how far behind the car
      const cameraHeight = 4;    // how high above the car

      // Calculate where "behind the car" is in world space
      const targetCameraX = car.position.x + Math.sin(car.rotation.y) * cameraDistance;
      const targetCameraZ = car.position.z + Math.cos(car.rotation.y) * cameraDistance;

      // Lerp = Linear Interpolation = smoothly move toward a target
      // formula: current + (target - current) * smoothing
      // smoothing of 0.05 = move 5% of the remaining distance each frame = smooth lag
      const smoothing = 0.05;
      camera.position.x += (targetCameraX - camera.position.x) * smoothing;
      camera.position.z += (targetCameraZ - camera.position.z) * smoothing;
      camera.position.y += (cameraHeight  - camera.position.y) * smoothing;

      // Always look at the car
      camera.lookAt(car.position);

      renderer.render(scene, camera);
    }

    animate();

    // Handle window resize
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
